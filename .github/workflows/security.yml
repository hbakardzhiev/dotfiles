name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # weekly full-history rescan
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  sops-integrity:
    name: Sops secrets stay encrypted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify secrets are encrypted and no age private keys are committed
        run: |
          set -euo pipefail
          fail=0

          while IFS= read -r f; do
            echo "checking $f"
            if ! grep -q 'ENC\[AES256_GCM' "$f"; then
              echo "::error file=$f::missing ENC[AES256_GCM ciphertext"
              fail=1
            fi
            if ! grep -q '^sops:' "$f"; then
              echo "::error file=$f::missing sops: metadata"
              fail=1
            fi
          done < <(find secrets -name 'secrets.yaml' -type f)

          # Build the needle without a contiguous literal so this file cannot match itself
          needle="AGE-SECRET-""KEY-"
          if grep -rIl "$needle" --exclude-dir=.git . 2>/dev/null; then
            echo "::error::age private key material found in the tree"
            fail=1
          fi

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "sops integrity: OK"

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  zizmor:
    name: zizmor (Actions security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/zizmor.tgz \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  /tmp/zizmor.tgz" | sha256sum -c -
          tar -xzf /tmp/zizmor.tgz -C /tmp
          /tmp/zizmor .github/
