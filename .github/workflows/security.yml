name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly full-history secret scan
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  sops-integrity:
    name: SOPS encryption integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify encrypted secrets
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' secret_files < <(
            find secrets -type f -name 'secrets.yaml' -print0
          )

          if [[ ${#secret_files[@]} -eq 0 ]]; then
            echo "::error::No SOPS secrets.yaml files found"
            exit 1
          fi

          for file in "${secret_files[@]}"; do
            echo "Checking $file"

            if ! grep -q 'ENC\[AES256_GCM' "$file"; then
              echo "::error file=$file::Missing encrypted SOPS data"
              exit 1
            fi

            if ! grep -q '^sops:' "$file"; then
              echo "::error file=$file::Missing SOPS metadata"
              exit 1
            fi
          done

          echo "SOPS integrity: OK"

      - name: Check for committed age private keys
        shell: bash
        run: |
          set -euo pipefail

          needle="AGE-SECRET-""KEY-"

          if grep -rIl "$needle" \
            --exclude-dir=.git \
            --exclude-dir=result \
            .; then
            echo "::error::Age private key material found in repository"
            exit 1
          fi

          echo "No age private keys found"

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail

          bash <(curl -sSfL \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

          ./actionlint -color

  zizmor:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        shell: bash
        run: |
          set -euo pipefail

          curl -sSL -o /tmp/zizmor.tgz \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz

          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  /tmp/zizmor.tgz" | sha256sum -c -

          tar -xzf /tmp/zizmor.tgz -C /tmp

          /tmp/zizmor .github/
