name: NixOS Security Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixos-security-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configuration-tests:
    name: Evaluate ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        host:
          - alice
          - bob
          - eve

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate NixOS configuration
        env:
          HOST: ${{ matrix.host }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Evaluating NixOS configuration: $HOST"
          echo "======================================"

          drv_path="$(
            nix eval \
              --no-write-lock-file \
              --raw \
              ".#nixosConfigurations.${HOST}.config.system.build.toplevel.drvPath"
          )"

          if [[ -z "$drv_path" ]]; then
            echo "::error::No system derivation produced for $HOST"
            exit 1
          fi

          echo "Configuration evaluated successfully."
          echo "Derivation: $drv_path"

          {
            echo "### NixOS configuration: $HOST"
            echo ""
            echo "- Status: SUCCESS"
            echo "- Derivation: \`$drv_path\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate NixOS assertions
        env:
          HOST: ${{ matrix.host }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking NixOS assertions for $HOST"

          assertions="$(
            nix eval \
              --no-write-lock-file \
              --json \
              --apply '
                assertions:
                  builtins.map
                    (a: a.message)
                    (builtins.filter (a: !a.assertion) assertions)
              ' \
              ".#nixosConfigurations.${HOST}.config.assertions"
          )"

          if [[ "$assertions" != "[]" ]]; then
            echo "::error::Failed NixOS assertions for $HOST:"
            echo "$assertions" | jq .
            exit 1
          fi

          echo "All NixOS assertions passed for $HOST."

      - name: Test NixOS configuration evaluation
        if: always()
        env:
          HOST: ${{ matrix.host }}
        run: |
          echo "Finished security evaluation for $HOST"
