name: ISO

# On-demand installer image. Manual only: the image is ~1 GB and is not
# needed on every push.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: nixosConfiguration to build an installer for
        required: true
        default: alice-iso
        type: string

permissions:
  contents: read

jobs:
  iso:
    name: build ${{ inputs.configuration }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Build ISO
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths --print-build-logs \
            ".#nixosConfigurations.${CONFIGURATION}.config.system.build.isoImage")
          ls -lh "$out/iso"
          cp -L "$out"/iso/*.iso .
          sha256sum ./*.iso > SHA256SUMS
          cat SHA256SUMS

      - name: Upload ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.configuration }}-iso
          path: |
            *.iso
            SHA256SUMS
          retention-days: 30
          compression-level: 0
